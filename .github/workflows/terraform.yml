---
# CI pipeline validating Terraform and bootstrap assets.
name: terraform

"on":
  pull_request:
    paths:
      - "terraform/**"
      - "cloud-init.sh"
      - ".github/workflows/terraform.yml"
      - "docker/**"
      - "scripts/**"
      - "templates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".markdownlint-cli2.jsonc"
      - ".yamllint"
      - ".lefthook.yml"
      - "Readme.md"
      - "UMAMI_LOGIN_RUNBOOK.md"
      - "LEGACY.md"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "cloud-init.sh"
      - ".github/workflows/terraform.yml"
      - "docker/**"
      - "scripts/**"
      - "templates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".markdownlint-cli2.jsonc"
      - ".yamllint"
      - ".lefthook.yml"
      - "Readme.md"
      - "UMAMI_LOGIN_RUNBOOK.md"
      - "LEGACY.md"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Run repo validation (same as local)
        run: pnpm run validate

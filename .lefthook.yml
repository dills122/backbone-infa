---
pre-commit:
  parallel: true
  commands:
    shellcheck:
      glob: "{*.sh,scripts/*.sh}"
      run: shellcheck {staged_files}

    yamllint:
      glob: "**/*.{yml,yaml}"
      run: yamllint {staged_files}

    terraform-fmt:
      glob: "terraform/*.tf"
      run: terraform -chdir=terraform fmt -check -recursive

    compose-config:
      glob: "docker/**"
      run: bash scripts/validate-compose-config.sh

pre-push:
  commands:
    terraform-validate:
      run: bash scripts/validate-terraform.sh

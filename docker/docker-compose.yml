---
# Backbone stack: Caddy reverse proxy with services
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: backbone-caddy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      CADDY_ADMIN_EMAIL: ${CADDY_ADMIN_EMAIL:?set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites.d:/etc/caddy/sites.d:ro
      - /opt/backbone-infa/sites:/srv/sites:ro
    networks:
      - backbone

  umami-db:
    image: postgres:15
    container_name: backbone-umami-db
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASS:?set in .env}
      POSTGRES_DB: umami
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backbone

  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:postgresql-latest}
    container_name: backbone-umami
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # yamllint disable-line
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASS:?set in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set in .env}
      BASE_URL: https://umami.dsteele.dev
    networks:
      - backbone

networks:
  backbone:
    name: backbone
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  umami_data:
